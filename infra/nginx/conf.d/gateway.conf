upstream auth_service {
    server auth-service:3001;
}

upstream user_service {
    server user-service:3002;
}

upstream workout_service {
    server workout-service:3003;
}

upstream progress_service {
    server progress-service:3004;
}

upstream chatbot_service {
    server chatbot-service:3005;
}

upstream notification_service {
    server notification-service:3006;
}

server {
    listen 80;
    server_name localhost;

    # Health check endpoint (nginx itself)
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Auth Service — /api/auth/*
    location /api/auth/ {
        proxy_pass http://auth_service/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # User Service — /api/users/*
    location /api/users/ {
        proxy_pass http://user_service/api/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Workout Service — /api/workouts/*
    location /api/workouts/ {
        proxy_pass http://workout_service/api/workouts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Progress Service — /api/progress/*
    location /api/progress/ {
        proxy_pass http://progress_service/api/progress/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Chatbot Service — /api/chatbot/*
    location /api/chatbot/ {
        proxy_pass http://chatbot_service/api/chatbot/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Notification Service — /api/notifications/*
    location /api/notifications/ {
        proxy_pass http://notification_service/api/notifications/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Catch-all: 404 cho các path không khớp
    location /api/ {
        return 404 '{"message":"API endpoint not found"}';
        add_header Content-Type application/json;
    }
}
